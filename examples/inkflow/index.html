<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InkFlow</title>
<style>
  :root {
    --bg:#0d1117;
    --panel:#12161d;
    --accent:#22d3ee;
    --text:#dbe3ec;
    --danger:#e06c75;
    --radius:6px;
  }
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
  #app{margin:2rem;max-width:420px;width:100%;background:var(--panel);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.4);padding:1rem;}
  h1{font-size:1.5rem;margin:0 0 .5rem;color:var(--accent);text-align:center;}
  .input-group{display:flex;gap:.5rem;margin-bottom:.5rem;}
  .input-group input{flex:1;padding:.5rem;border:none;border-radius:var(--radius);background:#1f2937;color:var(--text);}  
  .input-group button{padding:.5rem 1rem;background:var(--accent);border:none;border-radius:var(--radius);color:#000;cursor:pointer;}
  ul{list-style:none;padding:0;margin:0;}
  li{display:flex;align-items:center;justify-content:space-between;padding:.4rem .2rem;border-bottom:1px solid #2d333b;}
  li:last-child{border-bottom:none;}
  .todo-text{flex:1;margin:0 .5rem;cursor:pointer;}
  .todo-text.done{text-decoration:line-through;color:#8b949e;}
  .del{cursor:pointer;color:var(--danger);font-weight:bold;}
  .filters{display:flex;gap:.3rem;justify-content:center;margin:.5rem 0;}
  .filters button{background:transparent;border:none;color:var(--text);padding:.2rem .5rem;cursor:pointer; border-radius:var(--radius);}  
  .filters button.active{background:var(--accent);color:#000;}
  footer{font-size:.8rem;text-align:center;margin-top:.5rem;color:#8b949e;}
</style>
</head>
<body>
<div id="app">
  <h1>InkFlow</h1>
  <div class="input-group">
    <input id="newTodo" placeholder="Add a todo..." autocomplete="off" />
    <button id="addBtn">Add</button>
  </div>
  <ul id="todoList"></ul>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
  </div>
  <footer>InkFlow • Simple dark todo app</footer>
</div>
<script>
(() => {
  const STORAGE_KEY = 'inkflow_todos';
  const sample = [
    {id:Date.now()+1, text:'Welcome to InkFlow', done:false},
    {id:Date.now()+2, text:'Press Enter or Add', done:false},
    {id:Date.now()+3, text:'Enjoy the dark mode!', done:false}
  ];
  const $ = sel=>document.querySelector(sel);
  const $$ = sel=>Array.from(document.querySelectorAll(sel));
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
  const render =()=>{
    const list=$('#todoList');
    list.innerHTML='';
    const filter=$('.filters button.active').dataset.filter;
    const filtered=todos.filter(t=>filter==='all'?true:filter==='active'?!t.done:filter==='done'?t.done:true);
    filtered.forEach(t=>{
      const li=document.createElement('li');
      const cb=document.createElement('input');
      cb.type='checkbox';
      cb.checked=t.done;
      cb.onchange=()=>{t.done=cb.checked;persist();render();};
      const span=document.createElement('span');
      span.textContent=t.text;
      span.className='todo-text'+(t.done?' done':'');
      span.onclick=()=>{cb.checked=!cb.checked;cb.onchange();};
      const del=document.createElement('span');
      del.textContent='✕';
      del.className='del';
      del.onclick=()=>{todos=todos.filter(x=>x.id!==t.id);persist();render();};
      li.append(cb,span,del);
      list.appendChild(li);
    });
  };
  const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(todos));
  if(todos.length===0){todos=sample;persist();}
  $('#addBtn').onclick=()=>addTodo();
  $('#newTodo').addEventListener('keypress',e=>{if(e.key==='Enter')addTodo();});
  function addTodo(){
    const input=$('#newTodo');
    const txt=input.value.trim();
    if(txt){
      todos.push({id:Date.now(),text:txt,done:false});
      input.value='';
      persist();
      render();
    }
  }
  $$('.filters button').forEach(b=>b.onclick=()=>{
    $$('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render();
  });
  render();
})();
</script>
</body>
</html>
